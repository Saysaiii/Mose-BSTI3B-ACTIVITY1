{% extends 'dashboard/base.html' %}
{% load custom_filters %}

{% block content %}
    <h2>Dashboard Overview</h2>

    <div class="cards">
        {% for item in data %}
            <div class="card">
                <h3>{{ item.title }}</h3>
                <p>{{ item.count|currency_format }}</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
